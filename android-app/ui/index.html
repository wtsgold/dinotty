<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dinotty</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101014;
      color: #e6e6ea;
      font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
      padding: 24px;
      padding-top: env(safe-area-inset-top);
    }
    .card { width: 100%; max-width: 420px; }
    h1 { font-size: 28px; margin-bottom: 4px; letter-spacing: 1px; }
    .sub { color: #8a8a94; font-size: 13px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; color: #a0a0aa; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #2c2c34;
      background: #1a1a20;
      color: #e6e6ea;
      outline: none;
    }
    input:focus { border-color: #4c8dff; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #4c8dff;
      color: #fff;
    }
    button:active { opacity: 0.85; }
    .hint { margin-top: 14px; font-size: 12px; color: #6c6c76; line-height: 1.6; }
    .err { margin-top: 12px; font-size: 13px; color: #ff6b6b; display: none; }
    #cancelAuto {
      background: transparent;
      color: #8a8a94;
      font-weight: 400;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dinotty</h1>
    <div class="sub">连接到你的 Dinotty 服务器</div>
    <label for="server">服务器地址</label>
    <input id="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="http://100.86.95.56:8999" />
    <button id="connect">连接</button>
    <button id="cancelAuto">取消自动连接</button>
    <div class="err" id="err"></div>
    <div class="hint">
      填 Mac 上 Dinotty 的访问地址。局域网用 192.168.x.x，跨网络用 Tailscale 的
      100.x.x.x 地址（两台设备都需登录同一 Tailscale 账号）。地址会保存，下次打开自动连接。
    </div>
  </div>
  <script>
    const KEY = 'dinotty_server_url'
    const input = document.getElementById('server')
    const err = document.getElementById('err')
    const cancelBtn = document.getElementById('cancelAuto')
    let autoTimer = null

    function normalize(raw) {
      let url = raw.trim()
      if (!url) return null
      if (!/^https?:\/\//i.test(url)) url = 'http://' + url
      try {
        const u = new URL(url)
        if (!u.port && u.protocol === 'http:') u.port = '8999'
        // Keep path and query intact — the server's QR/share URL carries the
        // auth token as ?token=..., which must survive normalization.
        return u.href
      } catch {
        return null
      }
    }

    function go(url) {
      localStorage.setItem(KEY, url)
      location.replace(url)
    }

    document.getElementById('connect').addEventListener('click', () => {
      const url = normalize(input.value)
      if (!url) {
        err.textContent = '地址格式不对，例如：http://100.86.95.56:8999'
        err.style.display = 'block'
        return
      }
      go(url)
    })

    const saved = localStorage.getItem(KEY)
    if (saved) {
      input.value = saved
      cancelBtn.style.display = 'block'
      autoTimer = setTimeout(() => go(saved), 1800)
      cancelBtn.addEventListener('click', () => {
        clearTimeout(autoTimer)
        cancelBtn.style.display = 'none'
      })
      input.addEventListener('input', () => {
        clearTimeout(autoTimer)
        cancelBtn.style.display = 'none'
      })
    }
  </script>
</body>
</html>
